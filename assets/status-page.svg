<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348" role="img" aria-label="Status page. Overall: partially degraded. Auth and permissions, state machines, rollback plan and responding to quick questions are all operational. Caffeine delivery is degraded. Sleep schedule is a major outage. Shipping services at 99.58 percent over the last 90 days.">
<style>
.t{font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace}
.dim{fill:#8b949e;font-size:12px}
.nm{fill:#e6edf3;font-size:13px}
.pill{font-size:11px;text-anchor:middle}
.sep{stroke:#21262d;stroke-width:1;fill:none}
.wipe{animation:wipe .55s cubic-bezier(.3,.8,.4,1) both}
@keyframes wipe{from{transform:translateX(0)}to{transform:translateX(272px)}}
.pulse{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){
.wipe{animation:none;opacity:0}
.pulse{animation:none;opacity:1}
}
</style>

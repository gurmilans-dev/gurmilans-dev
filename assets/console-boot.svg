<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900" height="366" role="img" aria-label="Terminal running ./gurmilan --status: location Modena Italy [OK], role Software Engineer [OK], working at Phema s.r.l. [OK], focus operational software [OK], shipping Alfaaz [BUSY], graduating December 2026 [ETA]. I build software that has to survive contact with real users.">
  <style>
    .win   { fill: #0d1117; }
    .bar   { fill: #161b22; }
    .edge  { stroke: #30363d; stroke-width: 1; fill: none; }
    .t     { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .dim   { fill: #8b949e; }
    .txt   { fill: #c9d1d9; }
    .hi    { fill: #e6edf3; }
    .grn   { fill: #3fb950; }
    .amb   { fill: #d29922; }
    .blu   { fill: #58a6ff; }
    .pur   { fill: #bc8cff; }
    .lead  { stroke: #30363d; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0.5 7; fill: none; }

    /* command types itself: a cover slides right, cursor rides its left edge */
    .type  { animation: slide 1.15s steps(22, end) 0.25s both; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(232px); } }
    .caret { animation: fade 0.2s linear 1.4s both; }
    @keyframes fade { to { opacity: 0; } }

    /* boot lines resolve in sequence */
    .row   { opacity: 0; animation: in 0.32s ease-out both; }
    @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    .r1 { animation-delay: 1.60s; }
    .r2 { animation-delay: 1.85s; }
    .r3 { animation-delay: 2.10s; }
    .r4 { animation-delay: 2.35s; }
    .r5 { animation-delay: 2.60s; }
    .r6 { animation-delay: 2.85s; }
    .r7 { animation-delay: 3.25s; }
    .r8 { animation-delay: 3.70s; }

    .busy  { animation: pulse 1.4s ease-in-out 3.3s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    .blink { animation: bl 1.06s steps(1, end) 4s infinite; }
    @keyframes bl { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .type  { animation: none; transform: translateX(232px); }
      .caret { animation: none; opacity: 0; }
      .row   { animation: none; opacity: 1; transform: none; }
      .busy, .blink { animation: none; opacity: 1; }
    }
  </style>

  <!-- window -->
  <rect class="win" x="0.5" y="0.5" width="899" height="365" rx="10"/>
  <path class="bar" d="M0.5 10.5a10 10 0 0 1 10-10h879a10 10 0 0 1 10 10V40H0.5z"/>
  <path class="edge" d="M0.5 40h899"/>
  <rect class="edge" x="0.5" y="0.5" width="899" height="365" rx="10"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text class="t dim" x="450" y="25" font-size="12.5" text-anchor="middle">gurmilan@modena — ~/who</text>

  <!-- typed command -->
  <text class="t" x="30" y="80" font-size="15.5">
    <tspan class="grn">$</tspan><tspan class="hi" dx="8">./gurmilan --status</tspan>
  </text>
  <g class="type">
    <rect x="28" y="62" width="240" height="24" fill="#0d1117"/>
    <rect class="caret" x="28" y="64" width="9" height="19" fill="#3fb950"/>
  </g>

  <!-- status rows -->
  <g class="row r1">
    <text class="t dim" x="30" y="120" font-size="14.5">▸ location</text>
    <path class="lead" d="M182 115h268"/>
    <text class="t txt" x="466" y="120" font-size="14.5">Modena, Italy</text>
    <text class="t grn" x="866" y="120" font-size="14" text-anchor="end">[ OK ]</text>
  </g>
  <g class="row r2">
    <text class="t dim" x="30" y="150" font-size="14.5">▸ role</text>
    <path class="lead" d="M182 145h268"/>
    <text class="t txt" x="466" y="150" font-size="14.5">Software Engineer</text>
    <text class="t grn" x="866" y="150" font-size="14" text-anchor="end">[ OK ]</text>
  </g>
  <g class="row r3">
    <text class="t dim" x="30" y="180" font-size="14.5">▸ working</text>
    <path class="lead" d="M182 175h268"/>
    <text class="t txt" x="466" y="180" font-size="14.5">Phema s.r.l.</text>
    <text class="t grn" x="866" y="180" font-size="14" text-anchor="end">[ OK ]</text>
  </g>
  <g class="row r4">
    <text class="t dim" x="30" y="210" font-size="14.5">▸ focus</text>
    <path class="lead" d="M182 205h268"/>
    <text class="t txt" x="466" y="210" font-size="14.5">operational software</text>
    <text class="t grn" x="866" y="210" font-size="14" text-anchor="end">[ OK ]</text>
  </g>
  <g class="row r5">
    <text class="t dim" x="30" y="240" font-size="14.5">▸ shipping</text>
    <path class="lead" d="M182 235h268"/>
    <text class="t pur" x="466" y="240" font-size="14.5">Alfaaz</text>
    <text class="t amb busy" x="866" y="240" font-size="14" text-anchor="end">[ BUSY ]</text>
  </g>
  <g class="row r6">
    <text class="t dim" x="30" y="270" font-size="14.5">▸ graduating</text>
    <path class="lead" d="M182 265h268"/>
    <text class="t txt" x="466" y="270" font-size="14.5">December 2026</text>
    <text class="t blu" x="866" y="270" font-size="14" text-anchor="end">[ ETA ]</text>
  </g>

  <!-- tagline -->
  <g class="row r7">
    <path class="edge" d="M30 294h836"/>
    <text class="t hi" x="30" y="320" font-size="14.5">I build software that has to survive contact with real users.</text>
  </g>

  <!-- live prompt -->
  <g class="row r8">
    <text class="t" x="30" y="348" font-size="15.5"><tspan class="grn">$</tspan></text>
    <rect class="blink" x="47" y="333" width="9" height="19" fill="#3fb950"/>
  </g>
</svg>
